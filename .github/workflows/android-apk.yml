name: Android APK

on:
  push:
    branches:
      - arena/a8a1c307-bloodline
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2-stable"
  GODOT_RELEASE: "4.7.2-stable"

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;35.0.1 platforms;android-35 cmdline-tools;latest"

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --list_installed || true

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_RELEASE }}

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          cd ~/godot
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${GODOT_RELEASE}_linux.x86_64.zip"
          echo "Downloading $url"
          curl -fSL --retry 3 --retry-delay 5 -o godot.zip "$url"
          unzip -q -o godot.zip
          mv "Godot_v${GODOT_RELEASE}_linux.x86_64" godot
          chmod +x godot
          rm -f godot.zip
          ./godot --version

      - name: Download Godot export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          version="${GODOT_VERSION}"
          target="$HOME/.local/share/godot/export_templates/${version}"
          mkdir -p "$target"
          cd /tmp
          url="https://github.com/godotengine/godot-builds/releases/download/${GODOT_RELEASE}/Godot_v${version}_export_templates.tpz"
          echo "Downloading $url"
          curl -fSL --retry 3 --retry-delay 5 -o templates.tpz "$url"
          unzip -q -o templates.tpz -d /tmp/templates
          cp -r /tmp/templates/templates/. "$target"/
          rm -rf /tmp/templates templates.tpz
          ls "$target" | head -20
          test -f "$target/android_debug.apk"

      - name: Configure Godot editor settings
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.config/godot"
          sdk="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-$HOME/Android/Sdk}}"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$sdk"
          export/android/java_sdk_path = "${JAVA_HOME:-/usr/lib/jvm/temurin-17-jdk-amd64}"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          filesystem/import/blender/enabled = false
          network/connection/engine_version_update_mode = 0
          EOF
          echo "Editor settings written."

      - name: Create the debug keystore
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore "$HOME/.android/debug.keystore" \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
          fi

      - name: Install Python tools
        run: python3 -m pip install --upgrade pip && python3 -m pip install "gdtoolkit==4.5.0"

      - name: Lint GDScript
        run: |
          set -euo pipefail
          cd Game
          /opt/hostedtoolcache/Python/3.*/x64/bin/gdlint scripts 2>/dev/null \
            || gdlint scripts \
            || echo "gdlint reported issues (see above); continuing to the build."

      - name: Import the project
        run: |
          set -euo pipefail
          ~/godot/godot --headless --path Game --import

      - name: Export the debug APK
        run: |
          set -euo pipefail
          mkdir -p Game/build
          ~/godot/godot --headless --path Game --export-debug "Android" Game/build/bloodline-debug.apk
          ls -la Game/build

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: bloodline-debug-apk
          path: Game/build/bloodline-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            Game/build/
            ~/.config/godot/editor_settings-4.7.tres
          if-no-files-found: ignore
          retention-days: 7
